<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Matriarca Barranquilla · Reservas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');

:root{
  --bg: #12151a;
  --panel: #191d25;
  --panel-alt: #1f242e;
  --panel-raised: #262c38;
  --border: #2b313d;
  --border-soft: #232833;
  --text: #edeef1;
  --text-muted: #8b93a3;
  --text-dim: #5c6472;
  --gold: #c9a15a;
  --gold-bright: #e0bb78;
  --confirmed: #47b881;
  --confirmed-bg: rgba(71,184,129,0.14);
  --pending: #4fb0c9;
  --pending-bg: rgba(79,176,201,0.14);
  --walkin: #9aa3b2;
  --walkin-bg: rgba(154,163,178,0.14);
  --cancelled: #e5636a;
  --cancelled-bg: rgba(229,99,106,0.14);
  --radius: 10px;
  --radius-lg: 16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}

.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer; border:none;}
input,select,textarea{font-family:inherit;}

/* ===== HEADER ===== */
.app{display:flex; flex-direction:column; height:100vh;}
header{
  background:var(--panel);
  border-bottom:1px solid var(--border);
  padding:14px 20px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  flex-shrink:0;
}
.brand{
  font-family:'Fraunces',serif; font-weight:700; font-size:19px;
  color:var(--gold-bright); letter-spacing:0.3px; white-space:nowrap;
}
.brand span{color:var(--text-dim); font-weight:400; font-size:13px; margin-left:8px;}
.date-nav{display:flex; align-items:center; gap:6px;}
.date-nav button{
  width:30px; height:30px; border-radius:8px; background:var(--panel-alt);
  border:1px solid var(--border); color:var(--text-muted); font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.date-nav button:hover{color:var(--gold-bright); border-color:var(--gold);}
.date-label{
  font-size:13.5px; font-weight:600; min-width:190px; text-align:center;
  text-transform:capitalize; cursor:pointer; padding:4px 8px; border-radius:8px;
}
.date-label:hover{background:var(--panel-alt);}
.date-label .grupo{display:block; font-size:10.5px; font-weight:500; color:var(--text-dim); text-transform:none;}

.turnos{display:flex; gap:6px; margin-left:auto;}
.turno-pill{
  background:var(--panel-alt); border:1px solid var(--border); color:var(--text-muted);
  padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600;
  display:flex; align-items:center; gap:7px; transition:all .15s;
}
.turno-pill.off{opacity:.4;}
.turno-pill.active{
  background:linear-gradient(135deg, var(--gold) 0%, #a97f3f 100%);
  border-color:var(--gold); color:#1a1408;
}
.turno-pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

.new-btn{
  background:var(--gold); color:#1a1408; font-weight:700; font-size:13px;
  padding:9px 16px; border-radius:8px; display:flex; align-items:center; gap:6px;
}
.new-btn:hover{background:var(--gold-bright);}

/* ===== TABS + STATS BAR ===== */
.subbar{
  background:var(--panel); border-bottom:1px solid var(--border);
  padding:10px 20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  flex-shrink:0;
}
.tabs{display:flex; gap:4px; background:var(--panel-alt); padding:3px; border-radius:9px;}
.tab{
  padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600;
  color:var(--text-muted); background:transparent;
}
.tab.active{background:var(--panel-raised); color:var(--gold-bright);}
.stats{display:flex; gap:16px; margin-left:auto; flex-wrap:wrap;}
.stat{font-size:12px; color:var(--text-muted); display:flex; gap:6px; align-items:baseline;}
.stat b{color:var(--text); font-size:14px; font-family:'JetBrains Mono',monospace;}
.stat .max{color:var(--text-dim);}

/* ===== MAIN LAYOUT ===== */
main{flex:1; display:flex; overflow:hidden;}
.panel-lista{
  width:380px; flex-shrink:0; border-right:1px solid var(--border);
  overflow-y:auto; padding:14px;
}
.panel-plano{flex:1; overflow-y:auto; padding:18px;}
.panel-resumen{flex:1; overflow-y:auto; padding:20px;}

/* ===== RESERVATION CARDS ===== */
.res-card{
  background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:12px 13px; margin-bottom:8px; cursor:pointer; transition:border-color .15s;
}
.res-card:hover{border-color:var(--gold);}
.res-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.res-hora{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px; color:var(--gold-bright);}
.res-nombre{font-weight:600; font-size:13.5px; margin-top:3px;}
.res-meta{font-size:11.5px; color:var(--text-muted); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
.badge{
  font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;
  text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap;
}
.badge.confirmada{background:var(--confirmed-bg); color:var(--confirmed);}
.badge.pendiente{background:var(--pending-bg); color:var(--pending);}
.badge.walkin{background:var(--walkin-bg); color:var(--walkin);}
.badge.cancelada{background:var(--cancelled-bg); color:var(--cancelled);}
.vip-tag{
  font-size:10px; font-weight:700; color:var(--gold-bright); border:1px solid var(--gold);
  padding:2px 7px; border-radius:999px;
}
.empty-state{color:var(--text-dim); font-size:12.5px; text-align:center; padding:40px 10px;}

/* ===== FLOOR PLAN ===== */
.salon-group{margin-bottom:26px;}
.salon-head{
  display:flex; align-items:center; gap:10px; margin-bottom:12px;
  font-family:'Fraunces',serif; font-size:15px; font-weight:600; color:var(--text);
}
.salon-head .count{font-family:'Inter'; font-size:11px; color:var(--text-dim); font-weight:500;}
.salon-head.vip{color:var(--gold-bright);}
.salon-head .crown{color:var(--gold);}
.mesas-grid{display:flex; flex-wrap:wrap; gap:10px;}
.mesa{
  min-width:64px; min-height:64px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--panel-alt); display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6px; position:relative; transition:transform .12s;
}
.mesa:hover{transform:translateY(-2px);}
.mesa .num{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;}
.mesa .cap{font-size:9.5px; color:var(--text-dim); margin-top:1px;}
.mesa.ocupada{background:var(--confirmed-bg); border-color:var(--confirmed);}
.mesa.ocupada .num{color:var(--confirmed);}
.mesa.pendiente{background:var(--pending-bg); border-color:var(--pending);}
.mesa.pendiente .num{color:var(--pending);}
.mesa.libre .num{color:var(--text-muted);}
.mesa.vip{border-style:dashed; border-color:var(--gold);}
.mesa .guest{font-size:9px; color:var(--text-muted); max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}

.legend{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text-muted);}
.legend-dot{width:10px; height:10px; border-radius:3px;}

/* ===== RESUMEN ===== */
.resumen-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:24px;}
.kpi{background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:var(--radius-lg); padding:18px;}
.kpi .label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:600;}
.kpi .value{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin-top:6px; color:var(--gold-bright);}
.kpi .sub{font-size:11.5px; color:var(--text-dim); margin-top:4px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.bar-row .bl{width:90px; font-size:12px; color:var(--text-muted); flex-shrink:0;}
.bar-track{flex:1; height:8px; background:var(--panel-raised); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--gold) 0%, var(--gold-bright) 100%); border-radius:4px;}
.bar-val{width:70px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-muted); flex-shrink:0;}
.section-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin:24px 0 14px;}

/* ===== CALENDAR PICKER ===== */
.cal-modal{max-width:320px; padding:18px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.cal-head .cal-title{font-family:'Fraunces',serif; font-size:16px; font-weight:600; text-transform:capitalize;}
.cal-nav-btn{
  width:30px; height:30px; border-radius:8px; background:var(--panel-alt);
  border:1px solid var(--border); color:var(--text-muted); font-size:14px;
  display:flex; align-items:center; justify-content:center;
}
.cal-nav-btn:hover{color:var(--gold-bright); border-color:var(--gold);}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-bottom:6px;}
.cal-weekdays span{font-size:10px; text-align:center; color:var(--text-dim); font-weight:700; text-transform:uppercase;}
.cal-days{display:grid; grid-template-columns:repeat(7,1fr); gap:3px;}
.cal-day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  border-radius:8px; font-size:12.5px; font-family:'JetBrains Mono',monospace;
  color:var(--text); background:transparent; border:1px solid transparent;
}
.cal-day:hover{background:var(--panel-alt); border-color:var(--border);}
.cal-day.muted{color:var(--text-dim); opacity:.4;}
.cal-day.today{border-color:var(--gold); color:var(--gold-bright);}
.cal-day.selected{background:var(--gold); color:#1a1408; font-weight:700;}
.cal-jump{display:flex; gap:8px; margin-top:14px;}
.cal-jump select{
  flex:1; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
  padding:8px 9px; border-radius:8px; font-size:12.5px;
}
.cal-today-btn{
  margin-top:10px; width:100%; padding:9px; border-radius:8px; background:var(--panel-alt);
  border:1px solid var(--border); color:var(--text-muted); font-size:12.5px; font-weight:600;
}
.cal-today-btn:hover{color:var(--gold-bright); border-color:var(--gold);}

/* ===== MODAL ===== */
.overlay{
  position:fixed; inset:0; background:rgba(8,10,13,0.72); display:none;
  align-items:center; justify-content:center; z-index:100; padding:16px;
}
.overlay.open{display:flex;}
.modal{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-lg);
  width:100%; max-width:460px; max-height:90vh; overflow-y:auto; padding:22px;
}
.modal h3{font-family:'Fraunces',serif; font-size:19px; margin-bottom:4px;}
.modal .modal-sub{font-size:12px; color:var(--text-dim); margin-bottom:18px;}
.field{margin-bottom:13px;}
.field label{font-size:11.5px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px; text-transform:uppercase; letter-spacing:0.3px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text);
  padding:9px 11px; border-radius:8px; font-size:13.5px;
}
.field textarea{resize:vertical; min-height:52px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.estado-select{display:flex; gap:6px; flex-wrap:wrap;}
.estado-opt{
  padding:7px 12px; border-radius:999px; font-size:11.5px; font-weight:700; border:1.5px solid var(--border);
  background:var(--panel-alt); color:var(--text-muted);
}
.estado-opt.sel-confirmada.on{background:var(--confirmed-bg); border-color:var(--confirmed); color:var(--confirmed);}
.estado-opt.sel-pendiente.on{background:var(--pending-bg); border-color:var(--pending); color:var(--pending);}
.estado-opt.sel-walkin.on{background:var(--walkin-bg); border-color:var(--walkin); color:var(--walkin);}
.estado-opt.sel-cancelada.on{background:var(--cancelled-bg); border-color:var(--cancelled); color:var(--cancelled);}
.modal-actions{display:flex; gap:10px; margin-top:18px;}
.btn{padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; flex:1; text-align:center;}
.btn-primary{background:var(--gold); color:#1a1408;}
.btn-primary:hover{background:var(--gold-bright);}
.btn-ghost{background:var(--panel-alt); color:var(--text-muted); border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}
.btn-danger{background:transparent; color:var(--cancelled); border:1px solid var(--cancelled);}

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav{display:none;}

/* ===== RESPONSIVE ===== */
@media (max-width: 860px){
  header{padding:12px 14px; gap:10px;}
  .brand span{display:none;}
  .turnos{margin-left:0; order:3; width:100%; overflow-x:auto;}
  .new-btn span{display:none;}
  .subbar{padding:8px 14px;}
  .stats{display:none;}
  main{flex-direction:column;}
  .panel-lista{width:100%; border-right:none; border-bottom:1px solid var(--border); max-height:none;}
  .panel-lista, .panel-plano, .panel-resumen{display:none;}
  .panel-lista.mobile-active, .panel-plano.mobile-active, .panel-resumen.mobile-active{display:block;}
  .tabs{display:none;}
  .bottom-nav{
    display:flex; border-top:1px solid var(--border); background:var(--panel);
    flex-shrink:0;
  }
  .bottom-nav button{
    flex:1; padding:10px 4px 12px; background:transparent; color:var(--text-dim);
    font-size:10.5px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .bottom-nav button.active{color:var(--gold-bright);}
  .bottom-nav .icon{font-size:17px;}
}
</style>

</head>
<body>

<div class="app">
  <header>
    <div class="brand">La Matriarca <span>Barranquilla · Reservas</span></div>
    <div class="date-nav">
      <button onclick="cambiarDia(-1)">‹</button>
      <div class="date-label" id="dateLabel" onclick="abrirCalendario()"></div>
      <button onclick="cambiarDia(1)">›</button>
    </div>
    <div class="turnos" id="turnosBar"></div>
    <button class="new-btn" onclick="abrirModal()">+ <span>Nueva reserva</span></button>
  </header>

  <div class="subbar">
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="lista" onclick="cambiarVista('lista')">Lista</button>
      <button class="tab" data-view="plano" onclick="cambiarVista('plano')">Plano</button>
      <button class="tab" data-view="resumen" onclick="cambiarVista('resumen')">Resumen</button>
    </div>
    <div class="stats" id="statsBar"></div>
  </div>

  <main>
    <div class="panel-lista mobile-active" id="panelLista"></div>
    <div class="panel-plano" id="panelPlano"></div>
    <div class="panel-resumen" id="panelResumen"></div>
  </main>

  <div class="bottom-nav">
    <button data-view="lista" class="active" onclick="cambiarVista('lista')"><span class="icon">☰</span>Lista</button>
    <button data-view="plano" onclick="cambiarVista('plano')"><span class="icon">▦</span>Plano</button>
    <button data-view="resumen" onclick="cambiarVista('resumen')"><span class="icon">◔</span>Resumen</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Nueva reserva</h3>
    <div class="modal-sub" id="modalSub">Completa los datos del cliente y la mesa</div>

    <div class="field">
      <label>Estado</label>
      <div class="estado-select" id="estadoSelect">
        <button type="button" class="estado-opt sel-confirmada" data-val="confirmada">Confirmada</button>
        <button type="button" class="estado-opt sel-pendiente" data-val="pendiente">Pendiente</button>
        <button type="button" class="estado-opt sel-walkin" data-val="walkin">Walk-in</button>
        <button type="button" class="estado-opt sel-cancelada" data-val="cancelada">Cancelada</button>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Hora</label><input type="time" id="fHora"></div>
      <div class="field"><label>Pax</label><input type="number" id="fPax" min="1" placeholder="4"></div>
    </div>

    <div class="field"><label>Nombre completo</label><input type="text" id="fNombre" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Celular</label><input type="text" id="fCelular" placeholder="300 000 0000"></div>

    <div class="field-row">
      <div class="field">
        <label>Mesa / Zona</label>
        <select id="fMesa"></select>
      </div>
      <div class="field">
        <label>Canal</label>
        <select id="fCanal">
          <option>WhatsApp</option>
          <option>Teléfono</option>
          <option>Presencial</option>
          <option>Web</option>
        </select>
      </div>
    </div>

    <div class="field-row">
      <div class="field"><label>Abono ($)</label><input type="number" id="fAbono" placeholder="0"></div>
      <div class="field">
        <label>Menú</label>
        <select id="fMenu">
          <option value="">Sin definir</option>
          <option>Menú 1</option><option>Menú 2</option><option>Menú 3</option>
          <option>Menú 4</option><option>Menú 5</option>
          <option>Menú Típico</option><option>Carta abierta</option>
        </select>
      </div>
    </div>

    <div class="field"><label>Observaciones</label><textarea id="fObs" placeholder="Notas operativas..."></textarea></div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-danger" id="btnEliminar" style="display:none;" onclick="eliminarReserva()">Eliminar</button>
      <button class="btn btn-primary" onclick="guardarReserva()">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="calOverlay">
  <div class="modal cal-modal">
    <div class="cal-head">
      <button class="cal-nav-btn" onclick="cambiarMesCal(-1)">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav-btn" onclick="cambiarMesCal(1)">›</button>
    </div>
    <div class="cal-jump">
      <select id="calMesSelect" onchange="saltarMes()"></select>
      <select id="calAnoSelect" onchange="saltarMes()"></select>
    </div>
    <div class="cal-weekdays">
      <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
    </div>
    <div class="cal-days" id="calDays"></div>
    <button class="cal-today-btn" onclick="irHoy()">Ir a hoy</button>
  </div>
</div>

// Conexión en tiempo real a Firestore: cualquier cambio (de este dispositivo
// o de otro) se refleja automáticamente en la app.
const reservasRef = db.collection('reservas');

reservasRef.get().then(snap => {
  if (snap.empty) {
    // Primera vez: sembramos los datos de ejemplo en Firestore.
    const batch = db.batch();
    RESERVAS_SEED.forEach(r => batch.set(reservasRef.doc(), r));
    return batch.commit();
  }
}).then(() => {
  reservasRef.onSnapshot(snap => {
    reservas = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderAll();
  });
}).catch(err => {
  console.error('Error conectando con Firestore:', err);
  document.getElementById('panelLista').innerHTML =
    '<div class="empty-state">No se pudo conectar con la base de datos.<br>Revisa tu conexión e intenta de nuevo.</div>';
});

/* ============ STATE ============ */
let fechaActual = new Date('2026-08-14T12:00:00');
let turnoActivo = 'cena';
let vistaActual = 'lista';
let editandoId = null;
let mesaPreseleccionada = null;
let estadoSeleccionado = 'confirmada';

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function fechaISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============ RENDER: HEADER ============ */
function renderHeader(){
  const d = fechaActual;
  document.getElementById('dateLabel').innerHTML =
    `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}<span class="grupo">${HORARIOS[grupoDeFecha(d)].label}</span>`;

  const grupo = HORARIOS[grupoDeFecha(d)];
  const turnos = [['desayuno','Desayuno'],['almuerzo','Almuerzo'],['cena','Cena']];
  document.getElementById('turnosBar').innerHTML = turnos.map(([key,label])=>{
    const cfg = grupo[key];
    const off = !cfg.activo;
    const active = turnoActivo===key && !off;
    return `<button class="turno-pill ${off?'off':''} ${active?'active':''}" ${off?'disabled':`onclick="setTurno('${key}')"`}>
      <span class="dot"></span>${label}
    </button>`;
  }).join('');
}

/* ============ RENDER: STATS ============ */
function reservasDelTurno(){
  const iso = fechaISO(fechaActual);
  return reservas.filter(r=>r.fecha===iso && r.turno===turnoActivo);
}

function renderStats(){
  const grupo = HORARIOS[grupoDeFecha(fechaActual)][turnoActivo];
  const rs = reservasDelTurno().filter(r=>r.estado!=='cancelada');
  const pax = rs.reduce((a,r)=>a+Number(r.pax||0),0);
  const mesasOcupadas = new Set(rs.map(r=>r.mesa).filter(Boolean)).size;
  const totalMesas = SALONES.reduce((a,s)=>a+s.mesas.length,0);
  const pct = grupo.cap ? Math.round(pax/grupo.cap*100) : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat">Pax <b>${pax}</b><span class="max">/ ${grupo.cap}</span></div>
    <div class="stat">Mesas <b>${mesasOcupadas}</b><span class="max">/ ${totalMesas}</span></div>
    <div class="stat">Ocupación <b>${pct}%</b></div>
    <div class="stat">Horario <b>${grupo.inicio}–${grupo.fin}</b></div>
  `;
}

/* ============ RENDER: LISTA ============ */
function renderLista(){
  const rs = reservasDelTurno().sort((a,b)=>a.hora.localeCompare(b.hora));
  const el = document.getElementById('panelLista');
  if(rs.length===0){
    el.innerHTML = `<div class="empty-state">No hay reservas para este turno todavía.<br>Toca "+ Nueva reserva" para crear una.</div>`;
    return;
  }
  el.innerHTML = rs.map(r=>{
    const mesaTxt = r.mesa ? mesaLabel(r.mesa) : '—';
    const isVip = mesaEsVip(r.mesa);
    return `<div class="res-card" onclick="abrirModal(${r.id})">
      <div class="res-top">
        <div>
          <div class="res-hora">${r.hora}</div>
          <div class="res-nombre">${r.nombre}</div>
        </div>
        <span class="badge ${r.estado}">${estadoLabel(r.estado)}</span>
      </div>
      <div class="res-meta">
        <span>${r.pax} pax</span>
        <span>Mesa ${mesaTxt}</span>
        ${isVip?`<span class="vip-tag">VIP</span>`:''}
        ${r.abono>0?`<span>Abono $${Number(r.abono).toLocaleString('es-CO')}</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function estadoLabel(e){
  return {confirmada:'Confirmada', pendiente:'Pendiente', walkin:'Walk-in', cancelada:'Cancelada'}[e]||e;
}
function mesaLabel(id){
  for(const s of SALONES) for(const m of s.mesas) if(m.id===id) return m.id;
  return id;
}
function mesaEsVip(id){
  for(const s of SALONES) if(s.vip) for(const m of s.mesas) if(m.id===id) return true;
  return false;
}
function findMesa(id){
  for(const s of SALONES) for(const m of s.mesas) if(m.id===id) return {salon:s, mesa:m};
  return null;
}

/* ============ RENDER: PLANO ============ */
function renderPlano(){
  const rs = reservasDelTurno().filter(r=>r.estado!=='cancelada');
  const porMesa = {};
  rs.forEach(r=>{ if(r.mesa) porMesa[r.mesa]=r; });

  const legend = `<div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--confirmed)"></span>Confirmada</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--pending)"></span>Pendiente</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--panel-alt); border:1px solid var(--border);"></span>Libre</div>
    <div class="legend-item"><span class="legend-dot" style="border:1.5px dashed var(--gold); background:transparent;"></span>Zona VIP</div>
  </div>`;

  const groups = SALONES.map(s=>{
    const mesasHtml = s.mesas.map(m=>{
      const r = porMesa[m.id];
      let cls = 'libre';
      if(r) cls = r.estado==='pendiente' ? 'pendiente' : 'ocupada';
      const vipCls = s.vip ? 'vip' : '';
      const guestName = r ? (r.nombre.split(' ')[0]) : '';
      return `<div class="mesa ${cls} ${vipCls}" onclick="${r?`abrirModal(${r.id})`:`abrirModal(null,'${m.id}')`}" title="${m.id} · cap ${m.cap}">
        <div class="num">${m.id}</div>
        <div class="cap">${m.cap}p</div>
        ${guestName?`<div class="guest">${guestName}</div>`:''}
      </div>`;
    }).join('');
    const ocupadas = s.mesas.filter(m=>porMesa[m.id]).length;
    return `<div class="salon-group">
      <div class="salon-head ${s.vip?'vip':''}">${s.vip?'<span class="crown">♛</span> ':''}${s.nombre} <span class="count">(${ocupadas}/${s.mesas.length})</span></div>
      <div class="mesas-grid">${mesasHtml}</div>
    </div>`;
  }).join('');

  document.getElementById('panelPlano').innerHTML = legend + groups;
}

/* ============ RENDER: RESUMEN ============ */
function renderResumen(){
  const iso = fechaISO(fechaActual);
  const grupo = HORARIOS[grupoDeFecha(fechaActual)];
  const turnosKeys = ['desayuno','almuerzo','cena'];

  let totalPaxDia = 0, totalCapDia = 0;
  const barsHtml = turnosKeys.map(tk=>{
    const cfg = grupo[tk];
    const rs = reservas.filter(r=>r.fecha===iso && r.turno===tk && r.estado!=='cancelada');
    const pax = rs.reduce((a,r)=>a+Number(r.pax||0),0);
    totalPaxDia += pax; totalCapDia += (cfg.activo?cfg.cap:0);
    const pct = cfg.activo && cfg.cap ? Math.min(100,Math.round(pax/cfg.cap*100)) : 0;
    return `<div class="bar-row">
      <div class="bl">${tk.charAt(0).toUpperCase()+tk.slice(1)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="bar-val">${pax}/${cfg.activo?cfg.cap:0}</div>
    </div>`;
  }).join('');

  const rsHoy = reservas.filter(r=>r.fecha===iso && r.estado!=='cancelada');
  const vipCount = rsHoy.filter(r=>mesaEsVip(r.mesa)).length;
  const walkins = rsHoy.filter(r=>r.estado==='walkin').length;
  const pendientes = rsHoy.filter(r=>r.estado==='pendiente').length;
  const pctDia = totalCapDia? Math.round(totalPaxDia/totalCapDia*100):0;

  document.getElementById('panelResumen').innerHTML = `
    <div class="resumen-grid">
      <div class="kpi"><div class="label">Ocupación del día</div><div class="value">${pctDia}%</div><div class="sub">${totalPaxDia} de ${totalCapDia} pax</div></div>
      <div class="kpi"><div class="label">Reservas activas</div><div class="value">${rsHoy.length}</div><div class="sub">${pendientes} pendientes</div></div>
      <div class="kpi"><div class="label">Mesas VIP ocupadas</div><div class="value">${vipCount}</div><div class="sub">de 12 mesas VIP</div></div>
      <div class="kpi"><div class="label">Walk-ins</div><div class="value">${walkins}</div><div class="sub">sin reserva previa</div></div>
    </div>
    <div class="section-title">Ocupación por turno</div>
    ${barsHtml}
  `;
}

/* ============ VIEW SWITCHING ============ */
function cambiarVista(v){
  vistaActual = v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  document.querySelectorAll('.bottom-nav button').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  document.getElementById('panelLista').classList.toggle('mobile-active', v==='lista');
  document.getElementById('panelPlano').classList.toggle('mobile-active', v==='plano');
  document.getElementById('panelResumen').classList.toggle('mobile-active', v==='resumen');
  renderAll();
}

function setTurno(t){ turnoActivo = t; renderAll(); }
function cambiarDia(delta){
  fechaActual.setDate(fechaActual.getDate()+delta);
  const grupo = HORARIOS[grupoDeFecha(fechaActual)];
  if(!grupo[turnoActivo].activo){
    turnoActivo = ['almuerzo','cena','desayuno'].find(t=>grupo[t].activo) || 'almuerzo';
  }
  renderAll();
}

/* ============ CALENDAR PICKER ============ */
let calMes = fechaActual.getMonth();
let calAno = fechaActual.getFullYear();

function abrirCalendario(){
  calMes = fechaActual.getMonth();
  calAno = fechaActual.getFullYear();
  poblarSelectsCal();
  renderCalendario();
  document.getElementById('calOverlay').classList.add('open');
}
function cerrarCalendario(){
  document.getElementById('calOverlay').classList.remove('open');
}
function cambiarMesCal(delta){
  calMes += delta;
  if(calMes<0){calMes=11; calAno--;}
  if(calMes>11){calMes=0; calAno++;}
  poblarSelectsCal();
  renderCalendario();
}
function poblarSelectsCal(){
  const selMes = document.getElementById('calMesSelect');
  selMes.innerHTML = MESES.map((m,i)=>`<option value="${i}" ${i===calMes?'selected':''}>${m.charAt(0).toUpperCase()+m.slice(1)}</option>`).join('');
  const selAno = document.getElementById('calAnoSelect');
  const anoActual = new Date().getFullYear();
  let opts = '';
  for(let y=anoActual-1; y<=anoActual+2; y++){
    opts += `<option value="${y}" ${y===calAno?'selected':''}>${y}</option>`;
  }
  selAno.innerHTML = opts;
}
function saltarMes(){
  calMes = Number(document.getElementById('calMesSelect').value);
  calAno = Number(document.getElementById('calAnoSelect').value);
  renderCalendario();
}
function renderCalendario(){
  document.getElementById('calTitle').textContent = `${MESES[calMes]} ${calAno}`;
  document.getElementById('calMesSelect').value = calMes;
  document.getElementById('calAnoSelect').value = calAno;

  const primerDia = new Date(calAno, calMes, 1);
  const offset = primerDia.getDay(); // 0=domingo
  const diasEnMes = new Date(calAno, calMes+1, 0).getDate();
  const hoy = new Date();
  const hoyISO = fechaISO(hoy);
  const selISO = fechaISO(fechaActual);

  let html = '';
  // días del mes anterior para rellenar la grilla
  const diasMesAnterior = new Date(calAno, calMes, 0).getDate();
  for(let i=offset-1; i>=0; i--){
    html += `<div class="cal-day muted">${diasMesAnterior-i}</div>`;
  }
  for(let d=1; d<=diasEnMes; d++){
    const fecha = new Date(calAno, calMes, d, 12);
    const iso = fechaISO(fecha);
    let cls = 'cal-day';
    if(iso===hoyISO) cls += ' today';
    if(iso===selISO) cls += ' selected';
    html += `<div class="${cls}" onclick="seleccionarDiaCal(${d})">${d}</div>`;
  }
  const totalCeldas = offset + diasEnMes;
  const restante = (7 - (totalCeldas % 7)) % 7;
  for(let d=1; d<=restante; d++){
    html += `<div class="cal-day muted">${d}</div>`;
  }
  document.getElementById('calDays').innerHTML = html;
}
function seleccionarDiaCal(d){
  fechaActual = new Date(calAno, calMes, d, 12);
  const grupo = HORARIOS[grupoDeFecha(fechaActual)];
  if(!grupo[turnoActivo].activo){
    turnoActivo = ['almuerzo','cena','desayuno'].find(t=>grupo[t].activo) || 'almuerzo';
  }
  cerrarCalendario();
  renderAll();
}
function irHoy(){
  fechaActual = new Date();
  calMes = fechaActual.getMonth();
  calAno = fechaActual.getFullYear();
  cerrarCalendario();
  renderAll();
}
document.getElementById('calOverlay').addEventListener('click', e=>{
  if(e.target.id==='calOverlay') cerrarCalendario();
});

function renderAll(){
  renderHeader();
  renderStats();
  renderLista();
  renderPlano();
  renderResumen();
}

/* ============ MODAL ============ */
function poblarSelectMesas(){
  const sel = document.getElementById('fMesa');
  sel.innerHTML = '<option value="">Sin asignar</option>' + SALONES.map(s=>
    `<optgroup label="${s.nombre}">` +
    s.mesas.map(m=>`<option value="${m.id}">${m.id} (${m.cap}p)</option>`).join('') +
    `</optgroup>`
  ).join('');
}

function abrirModal(id, mesaId){
  poblarSelectMesas();
  editandoId = id || null;
  mesaPreseleccionada = mesaId || null;
  const overlay = document.getElementById('overlay');
  const btnEliminar = document.getElementById('btnEliminar');

  if(id){
    const r = reservas.find(x=>x.id===id);
    document.getElementById('modalTitle').textContent = 'Editar reserva';
    document.getElementById('modalSub').textContent = `${r.turno.charAt(0).toUpperCase()+r.turno.slice(1)} · ${fechaISO(fechaActual)}`;
    document.getElementById('fHora').value = r.hora;
    document.getElementById('fPax').value = r.pax;
    document.getElementById('fNombre').value = r.nombre;
    document.getElementById('fCelular').value = r.celular;
    document.getElementById('fMesa').value = r.mesa;
    document.getElementById('fCanal').value = r.canal;
    document.getElementById('fAbono').value = r.abono;
    document.getElementById('fMenu').value = r.menu;
    document.getElementById('fObs').value = r.obs;
    estadoSeleccionado = r.estado;
    btnEliminar.style.display = 'block';
  } else {
    document.getElementById('modalTitle').textContent = 'Nueva reserva';
    document.getElementById('modalSub').textContent = `${turnoActivo.charAt(0).toUpperCase()+turnoActivo.slice(1)} · ${fechaISO(fechaActual)}`;
    document.getElementById('fHora').value = '';
    document.getElementById('fPax').value = '';
    document.getElementById('fNombre').value = '';
    document.getElementById('fCelular').value = '';
    document.getElementById('fMesa').value = mesaId || '';
    document.getElementById('fCanal').value = 'WhatsApp';
    document.getElementById('fAbono').value = '';
    document.getElementById('fMenu').value = '';
    document.getElementById('fObs').value = '';
    estadoSeleccionado = 'confirmada';
    btnEliminar.style.display = 'none';
  }
  actualizarEstadoUI();
  overlay.classList.add('open');
}

function actualizarEstadoUI(){
  document.querySelectorAll('.estado-opt').forEach(b=>{
    b.classList.toggle('on', b.dataset.val===estadoSeleccionado);
  });
}
document.getElementById('estadoSelect').addEventListener('click', e=>{
  const btn = e.target.closest('.estado-opt');
  if(!btn) return;
  estadoSeleccionado = btn.dataset.val;
  actualizarEstadoUI();
});

function cerrarModal(){
  document.getElementById('overlay').classList.remove('open');
}

function guardarReserva(){
  const nombre = document.getElementById('fNombre').value.trim();
  if(!nombre){ alert('Ingresa el nombre del cliente.'); return; }
  const data = {
    fecha: fechaISO(fechaActual),
    turno: turnoActivo,
    hora: document.getElementById('fHora').value || '00:00',
    pax: Number(document.getElementById('fPax').value)||1,
    nombre,
    celular: document.getElementById('fCelular').value.trim(),
    mesa: document.getElementById('fMesa').value,
    canal: document.getElementById('fCanal').value,
    abono: Number(document.getElementById('fAbono').value)||0,
    menu: document.getElementById('fMenu').value,
    obs: document.getElementById('fObs').value.trim(),
    estado: estadoSeleccionado,
  };
  const promesa = editandoId
    ? reservasRef.doc(editandoId).update(data)
    : reservasRef.add(data);

  promesa.then(() => {
    cerrarModal(); // Firestore actualiza la app sola vía onSnapshot
  }).catch(err => {
    console.error('Error guardando reserva:', err);
    alert('No se pudo guardar la reserva. Revisa tu conexión e intenta de nuevo.');
  });
}

function eliminarReserva(){
  if(!editandoId) return;
  if(!confirm('¿Eliminar esta reserva?')) return;
  reservasRef.doc(editandoId).delete().then(() => {
    cerrarModal();
  }).catch(err => {
    console.error('Error eliminando reserva:', err);
    alert('No se pudo eliminar la reserva. Revisa tu conexión e intenta de nuevo.');
  });
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id==='overlay') cerrarModal();
});

/* ============ INIT ============ */
renderHeader(); // pinta el encabezado de inmediato; el resto llega con Firestore
</script>
